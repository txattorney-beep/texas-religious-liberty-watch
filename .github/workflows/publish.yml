name: Publish and update 90R tracker

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Central time, including daylight saving; gated catch-up attempts.
    - cron: '30 7,16 * * *'
      timezone: America/Chicago
    - cron: '50 7,16 * * *'
      timezone: America/Chicago
    - cron: '10 8,17 * * *'
      timezone: America/Chicago

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: texas-90r-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      published_sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site and updaters
        run: |
          python -m unittest discover -s tests
          node --test tests/pwa.test.cjs tests/site-search.test.cjs
      - name: Check Central-time refresh window
        id: due
        run: python scripts/refresh_health.py gate
      - name: Refresh all sections independently and retain last-good data
        if: steps.due.outputs.refresh == 'true'
        run: python scripts/refresh_health.py refresh
      - name: Build news, hearing, court, and search pages
        run: |
          python scripts/build_pages.py
      - name: Record enabled update mode
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('dist/data/bills.json')
          d=json.loads(p.read_text()); d['updateMode']='github-actions'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Save snapshot to repository
        id: snapshot
        run: |
          git config user.name "90R tracker update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "Refresh bills, hearings, news, court opinions, and public pages"
            git pull --rebase origin main
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Package portable source
        run: python scripts/package_starter.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.published_sha }}
      - name: Verify public snapshots and source health
        run: python scripts/refresh_health.py verify
      - name: Notify search engines of published changes
        id: indexnow
        continue-on-error: true
        run: python scripts/submit_indexnow.py
      - name: Save search notification receipt
        if: steps.indexnow.outcome == 'success'
        run: |
          git config user.name "90R tracker update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f search/indexnow-state.json ]; then
            git add search/indexnow-state.json
            if ! git diff --cached --quiet; then
              git commit -m "Record received IndexNow notifications"
              git push origin HEAD:main
            fi
          fi


